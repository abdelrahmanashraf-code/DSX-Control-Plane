[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dsx-control-plane"
version = "0.1.0"
description = "DSX SaaS Control Plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "sqlalchemy>=2.0.43,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.16,<2.0",
  "redis>=6.4,<7.0",
  "httpx>=0.28,<1.0",
  "psutil>=7.0,<8.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "ruff>=0.12,<1.0"
]

[project.scripts]
dsx-node-agent = "dsx_node_agent.main:main"
dsx-node-provisioner = "dsx_node_agent.provisioner_service:main"

[tool.setuptools.packages.find]
where = ["apps/api", "services/node_agent"]

[tool.pytest.ini_options]
pythonpath = ["apps/api", "services/node_agent"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
